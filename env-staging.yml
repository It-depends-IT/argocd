apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: env-staging
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: env-staging
  project: default
  source:
    path: overlays/staging
    repoURL: git@github.com:It-depends-IT/deployment.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
