apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: env-prod
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: env-prod
  project: default
  source:
    path: overlays/prod
    repoURL: git@github.com:It-depends-IT/deployment.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
