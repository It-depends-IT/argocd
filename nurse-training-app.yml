apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nurse-training-app
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: env-group1-test
  project: default
  source:
    path: overlays/k3s
    repoURL: git@github.com:It-depends-IT/deployment.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
